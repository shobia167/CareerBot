<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareerBot AI — Personalized Career & Learning Platform</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS with CareerBot Theme Palette -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ivory: {
                DEFAULT: '#F8F7F2',
                soft: '#EFEEE7',
              },
              midnight: {
                DEFAULT: '#17191C',
                light: '#252930',
                muted: '#666F7B',
              },
              lime: {
                neon: '#C5F36A',
                hover: '#b4e851',
                light: '#eefbce',
              },
              border: {
                neutral: '#DEDED5',
              },
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #f8f7f2;
        color: #17191c;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f8f7f2;
      }
      ::-webkit-scrollbar-thumb {
        background: #deded5;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #b6b6ab;
      }
    </style>
    <!-- Supabase JS Client & Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-ivory text-midnight antialiased min-h-screen selection:bg-lime-neon selection:text-midnight">
    <div id="app" class="flex flex-col min-h-screen"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
